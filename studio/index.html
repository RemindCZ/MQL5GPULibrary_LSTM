<!doctype html>
<html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DNForecast Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff3f8;color:#17233a;font:16px/1.5 "Segoe UI",system-ui,sans-serif}header{background:#0b152b url(/header.jpg) center/cover;color:white;padding:28px max(5vw,calc((100vw - 1000px)/2));border-bottom:3px solid #42bada}header small{color:#8be3ef;font-weight:700;letter-spacing:.13em}h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:5px 0 0}main{max-width:1000px;margin:26px auto;padding:0 18px}section{padding:22px 26px;background:white;border:1px solid #d4ddeb;border-radius:12px;margin-bottom:18px}h2{font-size:21px;margin:0 0 12px}label{display:block;font-size:14px;font-weight:600}select,input,button,.upload{font:inherit;padding:8px 11px;border:1px solid #b6c4d6;border-radius:6px;background:white;color:#17233a}select{width:100%}input[type=number]{display:block;width:100%;margin-top:4px}button,.upload{cursor:pointer}.upload{display:inline-block;margin:8px 0 0}.upload:focus-within,button:focus-visible{outline:3px solid #3e91d2}.upload input{width:1px;height:1px;opacity:0;position:absolute}button.primary{background:#1a4a9f;color:white;font-weight:bold;border-color:#1a4a9f}button:disabled{opacity:.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:18px 0}p,.hint{font-size:14px;color:#42546e}.job{padding:14px 0;border-top:1px solid #dae2ee;overflow-wrap:anywhere}pre{white-space:pre-wrap;font-size:12px;overflow:auto}a{color:#17539c}#message{font-weight:600;min-height:1.4em}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#jobs:empty:before{content:"Zatím nebyl spuštěn žádný trénink.";color:#566980}
table{width:100%;border-collapse:collapse;margin:12px 0 16px;font-variant-numeric:tabular-nums;font-size:14px}th,td{text-align:right;padding:6px 9px;border-bottom:1px solid #dde5ef}th{color:#354b64;background:#f3f6fa}th:first-child,td:first-child{text-align:left}@media(max-width:540px){section{padding:15px}th,td{font-size:12px;padding:4px}}</style><header><small>REMIND</small><h1>DNForecast Studio</h1></header>
<main><section><h2>Nový trénink</h2><label for="dataset">Historie uzavřených svíček</label><select id="dataset"></select>
<p>V MT5 spusťte na zvoleném grafu skript DNForecast_Train s volbou InpStudioHistoryOnly = true. Historii můžete také importovat jako CSV.</p>
<div class="actions"><label class="upload">Importovat CSV<input id="upload" type="file" accept=".csv,text/csv"></label><button id="refresh">Obnovit seznam</button></div>
<div class="grid"><label>Délka svíčky (s)<input id="seconds" type="number" min="1" max="31536000" value="3600"></label><label>Vstupní kroky<input id="steps" type="number" min="16" max="1024" value="96"></label><label>Horizonty<input id="horizons" type="number" min="1" max="64" value="6"></label><label>Epochy<input id="epochs" type="number" min="1" max="64" value="8"></label></div>
<button class="primary" id="train">Spustit trénink</button><div role="status" id="message"></div></section>
<section><h2>Tréninkové úlohy</h2><div id="jobs"></div></section></main>
<script>
const $=id=>document.getElementById(id), token='__NONCE__';
async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw Error(await r.text());return r}
async function send(url,body){return api(url,{method:'POST',headers:{'X-DNForecast-Key':token},body})}
function displayName(name){return name.replace(/-[0-9a-f]{32}(?=\.csv$)/i,'')}
function report(job,box){const lines=job.log.split(/\r?\n/);if(!job.model||lines[0]!=='horizon,test_mse,last_price_mse,coverage80'){const pre=document.createElement('pre');pre.textContent=job.log;box.append(pre);return}
const t=document.createElement('table'),hr=t.createTHead().insertRow();for(const h of ['Horizont','MSE modelu','MSE poslední ceny','Pokrytí 80% pásma']){const c=document.createElement('th');c.textContent=h;hr.append(c)}
const body=t.createTBody();for(const line of lines.slice(1)){if(!line)continue;const a=line.split(',').map(Number);if(a.length!==4||!a.every(Number.isFinite))continue;const row=body.insertRow();for(const v of [a[0],a[1].toLocaleString('cs-CZ',{maximumSignificantDigits:4}),a[2].toLocaleString('cs-CZ',{maximumSignificantDigits:4}),(100*a[3]).toFixed(1)+' %'])row.insertCell().textContent=v}box.append(t)}
function period(){const m=$('dataset').value.match(/-(\d+)s-/);if(m)$('seconds').value=m[1]}
async function refresh(){const state=await(await api('/api/state')).json(), previous=$('dataset').value;
const current=Array.from($('dataset').options,o=>o.value);if(JSON.stringify(current)!==JSON.stringify(state.datasets)){$('dataset').replaceChildren(...state.datasets.map(n=>new Option(displayName(n),n)));if(state.datasets.includes(previous))$('dataset').value=previous;else period()}
$('train').disabled=!state.datasets.length||state.busy;$('jobs').replaceChildren();for(const j of state.jobs){const box=document.createElement('div');box.className='job';const title=document.createElement('strong');title.textContent=displayName(j.dataset)+' · '+j.status;title.title=j.dataset;box.append(title);
if(j.contract){const info=document.createElement('p');info.textContent=j.contract;box.append(info)}if(j.log)report(j,box);if(j.model){const a=document.createElement('a');a.href='/model/'+j.id;a.download=j.model;a.textContent='Stáhnout model ONNX';box.append(a);const p=document.createElement('p');p.textContent='V indikátoru použijte InpModelFile = DNForecast\\'+j.model;p.className='hint';box.append(p)}$('jobs').append(box)}}
function failure(e){$('message').textContent=e.message}
$('dataset').onchange=period;$('refresh').onclick=()=>refresh().catch(failure);
$('train').onclick=async()=>{try{$('train').disabled=true;const val=new URLSearchParams({file:$('dataset').value});for(const k of ['seconds','steps','horizons','epochs'])val.set(k,$(k).value);
await send('/api/train?'+val,'');$('message').textContent='Trénink běží na serveru. Tuto kartu můžete zavřít.';await refresh()}catch(e){failure(e)}};
$('upload').onchange=async()=>{const f=$('upload').files[0];if(!f)return;try{const name=await(await send('/api/import?name='+encodeURIComponent(f.name),f)).text();await refresh();$('dataset').value=name;period();$('message').textContent='Historie je připravena.'}catch(e){failure(e)}finally{$('upload').value=''}};
refresh().catch(failure);setInterval(()=>refresh().catch(failure),3000);
</script></html>
