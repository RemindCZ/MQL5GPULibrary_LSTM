name: Review signature

on:
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Pull request number (empty checks all open pull requests)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: repository-review-signature
  cancel-in-progress: false

jobs:
  sign:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.review.user.login == 'chatgpt-codex-connector[bot]' ||
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never execute pull-request code with a token that can edit reviews.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check signing rules
        run: python3 tests/test_review_signature.py
      - name: Append repository signature
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PULL_NUMBER: ${{ inputs.pull_number }}
        run: python3 tools/sign_reviews.py
